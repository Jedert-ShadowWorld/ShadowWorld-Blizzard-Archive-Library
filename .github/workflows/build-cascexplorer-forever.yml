name: Build WoW Forever CASCExplorer (Windows)

on:
  push:
    branches:
      - build/forever-cascexplorer
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Clone original CASCExplorer with dependencies
        shell: pwsh
        run: |
          git clone --recurse-submodules https://github.com/WoW-Tools/CASCExplorer.git source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Copy Forever-specific DB2 browser into source tree
        shell: pwsh
        run: |
          Copy-Item "tools/forever-cascexplorer/ForeverDataBrowserForm.cs" "source/CASCExplorer/ForeverDataBrowserForm.cs"

      - name: Apply WoW Forever local patch
        shell: pwsh
        run: |
          py -3 tools/forever-cascexplorer/apply_forever_patch.py source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile .NET Framework 4.8 with Visual Studio 2022
        shell: pwsh
        run: |
          $nuget = (Get-Command nuget.exe -ErrorAction SilentlyContinue).Source
          if ($nuget) {
            & $nuget restore "source/CASCExplorer.sln" -NonInteractive
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "Visual Studio MSBuild not available" }
          & $msbuild "source/CASCExplorer.sln" /t:Restore,Build /p:Configuration=Release '/p:Platform=Any CPU' /m /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch latest community listfile (required for named files)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "CASCExplorer-Forever" | Out-Null
          $url = 'https://github.com/wowdev/wow-listfile/releases/latest/download/community-listfile.csv'
          curl.exe --fail --location --retry 3 --retry-delay 5 --output "CASCExplorer-Forever/listfile.csv" $url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $len = (Get-Item "CASCExplorer-Forever/listfile.csv").Length
          if ($len -lt 10000000) { throw "Downloaded listfile too small; refusing to publish" }
          Write-Host "Bundled community listfile of $len bytes"

      - name: Package portable binary and documentation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "CASCExplorer-Forever" | Out-Null
          Copy-Item "source/CASCExplorer/bin/Release/*" "CASCExplorer-Forever/" -Recurse -Force
          @(
            "WoW Forever CASCExplorer - portable, Windows, .NET Framework 4.8.",
            "Tools > Forever DB2 browser: race/model/texture IDs from your own CSV exports.",
            "Put the six exported CSV files in a folder named ForeverData beside the EXE.",
            "This build does not ship your private/custom CSV files inside the GitHub artifact.",
            "Extract the entire ZIP (including listfile.csv) to a writable folder.",
            "Run CASCExplorer.exe, then File > Open Storage.",
            "Choose the World of Warcraft installation folder containing .build.info.",
            "The program will load listfile.csv from its own folder automatically.",
            "For your own additions place forever-listfile.csv in the WoW game root.",
            "File > Open list file supports selecting a CSV file manually and refreshes the UI.",
            "Community listfile by wowdev/wow-listfile (github.com/wowdev/wow-listfile).",
            "Some WoW Forever names may still be unknown; full client compatibility not guaranteed."
          ) | Out-File "CASCExplorer-Forever/README_FOREVER.txt" -Encoding utf8
          if (-not (Test-Path "CASCExplorer-Forever/CASCExplorer.exe")) { throw "Missing CASCExplorer.exe after build" }

      - uses: actions/upload-artifact@v4
        with:
          name: CASCExplorer-Forever-Windows
          path: CASCExplorer-Forever/
          if-no-files-found: error
          retention-days: 14
